# BlueSight AI - Streamlit settings.
# Privacy: no usage statistics are sent, and the app only listens on this computer.

[browser]
gatherUsageStats = false          # Streamlit collects anonymous usage stats by default; turned off
serverAddress = "localhost"

[server]
address = "localhost"             # only reachable from this machine (not the local network)
headless = true
maxUploadSize = 8192              # MB; 4K survey videos are large
runOnSave = false
enableStaticServing = true        # serves static/ (the bundled font) from this computer; nothing is fetched online

[client]
toolbarMode = "viewer"            # keeps the ⋮ menu, where Settings → theme (Light / Dark / System) lives
showErrorDetails = "full"         # tracebacks stay visible to the biologist (they're on this computer)
showErrorLinks = false            # no "Ask Google" / "Ask ChatGPT" buttons on errors (they'd send error text to a hosted service)

[global]
showWarningOnDirectExecution = false

# Light and dark themes (see app/ui/theme.py and DECISIONS.md D24). With both defined, the app follows the
# computer's light/dark setting, and the reader can override it in ⋮ → Settings. All text >= 4.5:1.
# Visual identity (DECISIONS.md D36): nautical-chart palette, one typeface chosen for legibility
# (Atkinson Hyperlegible Next, SIL OFL, bundled in static/fonts so it works offline). All text >= 4.5:1.
[theme]
font = "'Atkinson Hyperlegible Next', sans-serif"
headingFont = "'Atkinson Hyperlegible Next', sans-serif"
codeFont = "monospace"
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/AtkinsonHyperlegibleNext-Variable.woff2"
weight = "200 800"
style = "normal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/AtkinsonHyperlegibleNext-Italic-Variable.woff2"
weight = "200 800"
style = "italic"

[theme.light]
primaryColor = "#2A5D7C"          # sounding blue (6.9:1 with white text)
backgroundColor = "#F1F4F0"       # chart paper
secondaryBackgroundColor = "#E4ECEB"
textColor = "#11293A"             # deep-water ink
borderColor = "#C9D5D4"
linkColor = "#2A5D7C"
dataframeHeaderBackgroundColor = "#E4ECEB"

[theme.light.sidebar]
backgroundColor = "#E6ECE8"
secondaryBackgroundColor = "#F7F9F6"

[theme.dark]
primaryColor = "#3B7BA0"          # 4.7:1 with white button text
backgroundColor = "#0E1C26"       # night water
secondaryBackgroundColor = "#182B37"
textColor = "#E2EBEE"
borderColor = "#2A3F4C"
linkColor = "#8CC3DC"
dataframeHeaderBackgroundColor = "#182B37"

[theme.dark.sidebar]
backgroundColor = "#11222D"
secondaryBackgroundColor = "#182B37"
