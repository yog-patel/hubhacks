[project]
name = "bluesight"
version = "0.1.0"
description = "BlueSight AI: local fish detection, counting and unfamiliar-species flagging for Coastal Action"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
